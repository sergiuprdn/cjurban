<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbanism Cluj-Napoca</title>
    <style>
        *, *::before, *::after {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        :root {
          --background: #f9fafb;
          --surface: #ffffff;
          --surface-hover: #f3f4f6;
          --text-primary: #111827;
          --text-secondary: #6b7280;
          --border-color: #e5e7eb;
          --accent: #2563eb;
          --accent-soft: #eff6ff;
        }

        body {
          font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: var(--background);
          color: var(--text-primary);
          line-height: 1.5;
        }

        .container {
          max-width: 900px;
          margin: 0 auto;
          padding: 24px;
        }

        header {
          text-align: center;
          margin-bottom: 28px;
        }

        h1 {
          font-size: 2rem;
          font-weight: 700;
          margin-bottom: 8px;
        }

        .subtitle {
          color: var(--text-secondary);
          font-size: 1rem;
        }

        .tabs {
          display: flex;
          gap: 8px;
          margin-bottom: 28px;
          padding: 5px;
          background: var(--surface-hover);
          border: 1px solid var(--border-color);
          border-radius: 10px;
        }

        .tab-button {
          flex: 1;
          min-height: 44px;
          padding: 9px 14px;
          border: 0;
          border-radius: 7px;
          background: transparent;
          color: var(--text-secondary);
          font: inherit;
          font-weight: 600;
          cursor: pointer;
        }

        .tab-button:hover {
          color: var(--text-primary);
        }

        .tab-button.active {
          color: var(--accent);
          background: var(--surface);
          box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
        }

        .tab-button:focus-visible,
        .search-box:focus-visible,
        a:focus-visible {
          outline: 3px solid rgb(37 99 235 / 0.3);
          outline-offset: 2px;
        }

        .search-container {
          margin-bottom: 32px;
          position: relative;
        }

        .search-box {
          width: 100%;
          padding: 12px 42px 12px 14px;
          font-size: 1rem;
          border: 1px solid var(--border-color);
          border-radius: 8px;
          background: var(--surface);
          color: var(--text-primary);
        }

        .search-icon {
          position: absolute;
          right: 12px;
          top: 50%;
          transform: translateY(-50%);
          color: var(--text-secondary);
          pointer-events: none;
          font-size: 1.1rem;
        }

        .stats {
          display: flex;
          gap: 16px;
          margin-bottom: 32px;
          flex-wrap: wrap;
        }

        .stat-card {
          flex: 1;
          min-width: 160px;
          padding: 20px;
          background: var(--surface);
          border-radius: 8px;
          border: 1px solid var(--border-color);
          text-align: center;
        }

        .stat-number {
          font-size: 1.5rem;
          font-weight: 600;
          color: var(--accent);
          margin-bottom: 4px;
        }

        .stat-label {
          font-size: 0.85rem;
          color: var(--text-secondary);
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }

        .meeting-card,
        .certificate-card {
          background: var(--surface);
          border: 1px solid var(--border-color);
          border-radius: 10px;
          padding: 20px;
          margin-bottom: 20px;
        }

        .card-header {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          gap: 16px;
          margin-bottom: 16px;
        }

        .card-title {
          font-size: 1.1rem;
          font-weight: 600;
        }

        .card-link,
        .project-link {
          color: var(--accent);
          text-decoration: none;
          white-space: nowrap;
        }

        .card-link {
          font-size: 0.9rem;
        }

        .projects-label,
        .field-label,
        .certificate-date {
          font-size: 0.85rem;
          color: var(--text-secondary);
        }

        .projects-label {
          margin-bottom: 8px;
        }

        .project-item,
        .certificate-field {
          background: var(--surface-hover);
          border-radius: 6px;
          padding: 12px;
          margin-bottom: 10px;
        }

        .project-item:last-child,
        .certificate-field:last-child {
          margin-bottom: 0;
        }

        .project-title {
          font-weight: 500;
          margin-bottom: 4px;
        }

        .project-street {
          font-size: 0.85rem;
          color: var(--text-secondary);
          margin-bottom: 6px;
        }

        .project-link {
          font-size: 0.85rem;
        }

        .certificate-date {
          margin: -8px 0 14px;
        }

        .field-label {
          margin-bottom: 4px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.04em;
        }

        .no-results {
          text-align: center;
          padding: 40px 20px;
          color: var(--text-secondary);
          background: var(--surface);
          border-radius: 8px;
          border: 1px solid var(--border-color);
        }

        .error-message {
          color: #991b1b;
          background: #fef2f2;
          border-color: #fecaca;
        }

        .highlight {
          background: #fde68a;
          padding: 2px 3px;
          border-radius: 3px;
        }

        .screen-reader-text {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
        }

        @media (max-width: 600px) {
          .container {
            padding: 18px;
          }

          h1 {
            font-size: 1.65rem;
          }

          .tabs,
          .card-header {
            flex-direction: column;
          }

          .tab-button {
            width: 100%;
          }

          .card-header {
            align-items: flex-start;
          }
        }
    </style>
</head>
<body>
<main class="container">
    <header>
        <h1>Urbanism Cluj-Napoca</h1>
        <p class="subtitle">Ședințe ale comisiei, certificate și autorizații de construire</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Categorii urbanism">
        <button id="meetingsTab" class="tab-button active" type="button" role="tab"
                aria-selected="true" aria-controls="contentPanel" data-view="meetings">
            Ședințe comisie
        </button>
        <button id="certificatesTab" class="tab-button" type="button" role="tab"
                aria-selected="false" aria-controls="contentPanel" data-view="certificates" tabindex="-1">
            Certificate de urbanism
        </button>
        <button id="constructionPermitsTab" class="tab-button" type="button" role="tab"
                aria-selected="false" aria-controls="contentPanel" data-view="constructionPermits" tabindex="-1">
            Autorizații de construire
        </button>
    </div>

    <section id="contentPanel" role="tabpanel" aria-labelledby="meetingsTab">
        <div class="search-container">
            <label class="screen-reader-text" for="searchInput">Caută</label>
            <input type="search" id="searchInput" class="search-box"
                   placeholder="Caută proiecte sau ședințe..." autocomplete="off">
            <span class="search-icon" aria-hidden="true">🔍</span>
        </div>

        <div class="stats" aria-live="polite">
            <div class="stat-card">
                <div class="stat-number" id="primaryTotal">0</div>
                <div class="stat-label" id="primaryLabel">Ședințe</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="secondaryTotal">0</div>
                <div class="stat-label" id="secondaryLabel">Proiecte</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="visibleItems">0</div>
                <div class="stat-label">Rezultate</div>
            </div>
        </div>

        <div id="resultsContainer"></div>
    </section>
</main>

<script>
    const datasets = {
      meetings: [],
      certificates: [],
      constructionPermits: []
    };
    const loadErrors = {};
    const searchTerms = {
      meetings: '',
      certificates: '',
      constructionPermits: ''
    };
    let activeView = 'meetings';

    const viewConfig = {
      meetings: {
        tabId: 'meetingsTab',
        hash: '#sedinte',
        placeholder: 'Caută proiecte sau ședințe...',
        primaryLabel: 'Ședințe',
        secondaryLabel: 'Proiecte'
      },
      certificates: {
        tabId: 'certificatesTab',
        hash: '#certificate',
        placeholder: 'Caută după număr, dată, scop sau adresă...',
        primaryLabel: 'Certificate',
        secondaryLabel: 'Ani'
      },
      constructionPermits: {
        tabId: 'constructionPermitsTab',
        hash: '#autorizatii-construire',
        placeholder: 'Caută după număr, dată, lucrări sau adresă...',
        primaryLabel: 'Autorizații',
        secondaryLabel: 'Ani'
      }
    };

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = String(value ?? '');
      return div.innerHTML;
    }

    function highlightText(value, searchTerm) {
      const text = String(value ?? '');
      if (!searchTerm) return escapeHtml(text);

      const escapedTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escapedTerm})`, 'gi');
      return text.split(regex).map((part, index) =>
        index % 2 === 1
          ? `<span class="highlight">${escapeHtml(part)}</span>`
          : escapeHtml(part)
      ).join('');
    }

    function safeUrl(value) {
      try {
        const url = new URL(value, window.location.href);
        if (url.protocol === 'http:' || url.protocol === 'https:') {
          return escapeHtml(url.href);
        }
      } catch (error) {
        // Invalid crawler data is rendered as a disabled link.
      }
      return '#';
    }

    function searchable(value) {
      return String(value ?? '').toLocaleLowerCase('ro-RO');
    }

    function renderMeetings(searchTerm) {
      const term = searchable(searchTerm);
      const meetings = datasets.meetings.flatMap(meeting => {
        const projects = Array.isArray(meeting.projects) ? meeting.projects : [];
        if (!term || searchable(meeting.title).includes(term)) {
          return [{...meeting, projects}];
        }

        const matchingProjects = projects.filter(project =>
          searchable(project.title).includes(term)
          || searchable(project.street).includes(term)
        );
        return matchingProjects.length > 0 ? [{...meeting, projects: matchingProjects}] : [];
      });

      const visibleProjects = meetings.reduce((sum, meeting) => sum + meeting.projects.length, 0);
      updateStats(
        datasets.meetings.length,
        datasets.meetings.reduce((sum, meeting) =>
          sum + (Array.isArray(meeting.projects) ? meeting.projects.length : 0), 0),
        visibleProjects
      );

      if (meetings.length === 0) {
        renderEmptyState();
        return;
      }

      document.getElementById('resultsContainer').innerHTML = meetings.map(meeting => `
        <article class="meeting-card">
          <div class="card-header">
            <h2 class="card-title">${highlightText(meeting.title, searchTerm)}</h2>
            <a href="${safeUrl(meeting.url)}" target="_blank" rel="noopener noreferrer" class="card-link">
              Detalii →
            </a>
          </div>
          <div class="projects-label">Proiecte (${meeting.projects.length})</div>
          ${meeting.projects.map(project => `
            <div class="project-item">
              <div class="project-title">${highlightText(project.title, searchTerm)}</div>
              ${project.street ? `
                <div class="project-street">📍 ${highlightText(project.street, searchTerm)}</div>
              ` : ''}
              <a href="${safeUrl(project.url)}" target="_blank" rel="noopener noreferrer" class="project-link">
                Vezi proiectul →
              </a>
            </div>
          `).join('')}
        </article>
      `).join('');
    }

    function renderCertificates(searchTerm) {
      const term = searchable(searchTerm);
      const certificates = datasets.certificates.filter(certificate => {
        if (!term) return true;
        return [certificate.title, certificate.date, certificate.purpose, certificate.address]
          .some(value => searchable(value).includes(term));
      });

      const coveredYears = new Set(datasets.certificates.flatMap(certificate => {
        const match = `${certificate.title ?? ''} ${certificate.date ?? ''}`.match(/\b(?:19|20)\d{2}\b/g);
        return match ? [match.at(-1)] : [];
      }));
      updateStats(datasets.certificates.length, coveredYears.size, certificates.length);

      if (certificates.length === 0) {
        renderEmptyState();
        return;
      }

      document.getElementById('resultsContainer').innerHTML = certificates.map(certificate => `
        <article class="certificate-card">
          <div class="card-header">
            <h2 class="card-title">${highlightText(certificate.title, searchTerm)}</h2>
            <a href="${safeUrl(certificate.url)}" target="_blank" rel="noopener noreferrer" class="card-link">
              Detalii →
            </a>
          </div>
          ${certificate.date ? `
            <div class="certificate-date">Emis la ${highlightText(certificate.date, searchTerm)}</div>
          ` : ''}
          ${certificate.purpose ? `
            <div class="certificate-field">
              <div class="field-label">Scop</div>
              <div>${highlightText(certificate.purpose, searchTerm)}</div>
            </div>
          ` : ''}
          ${certificate.address ? `
            <div class="certificate-field">
              <div class="field-label">Adresă</div>
              <div>📍 ${highlightText(certificate.address, searchTerm)}</div>
            </div>
          ` : ''}
        </article>
      `).join('');
    }

    function renderConstructionPermits(searchTerm) {
      const term = searchable(searchTerm);
      const permits = datasets.constructionPermits.filter(permit => {
        if (!term) return true;
        return [permit.title, permit.date, permit.works, permit.address]
          .some(value => searchable(value).includes(term));
      });

      const coveredYears = new Set(datasets.constructionPermits.flatMap(permit => {
        const match = `${permit.title ?? ''} ${permit.date ?? ''}`.match(/\b(?:19|20)\d{2}\b/g);
        return match ? [match.at(-1)] : [];
      }));
      updateStats(datasets.constructionPermits.length, coveredYears.size, permits.length);

      if (permits.length === 0) {
        renderEmptyState();
        return;
      }

      document.getElementById('resultsContainer').innerHTML = permits.map(permit => `
        <article class="certificate-card permit-card">
          <div class="card-header">
            <h2 class="card-title">${highlightText(permit.title, searchTerm)}</h2>
            <a href="${safeUrl(permit.url)}" target="_blank" rel="noopener noreferrer" class="card-link">
              Detalii →
            </a>
          </div>
          ${permit.date ? `
            <div class="certificate-date">Emisă la ${highlightText(permit.date, searchTerm)}</div>
          ` : ''}
          ${permit.works ? `
            <div class="certificate-field">
              <div class="field-label">Lucrări</div>
              <div>${highlightText(permit.works, searchTerm)}</div>
            </div>
          ` : ''}
          ${permit.address ? `
            <div class="certificate-field">
              <div class="field-label">Adresă</div>
              <div>📍 ${highlightText(permit.address, searchTerm)}</div>
            </div>
          ` : ''}
        </article>
      `).join('');
    }

    function renderEmptyState() {
      const container = document.getElementById('resultsContainer');
      if (loadErrors[activeView]) {
        container.innerHTML = `<div class="no-results error-message">${escapeHtml(loadErrors[activeView])}</div>`;
        return;
      }
      container.innerHTML = '<div class="no-results">🔍 Nu s-au găsit rezultate</div>';
    }

    function updateStats(primary, secondary, visible) {
      document.getElementById('primaryTotal').textContent = primary.toLocaleString('ro-RO');
      document.getElementById('secondaryTotal').textContent = secondary.toLocaleString('ro-RO');
      document.getElementById('visibleItems').textContent = visible.toLocaleString('ro-RO');
    }

    function renderActiveView() {
      const term = searchTerms[activeView];
      if (activeView === 'meetings') {
        renderMeetings(term);
      } else if (activeView === 'certificates') {
        renderCertificates(term);
      } else {
        renderConstructionPermits(term);
      }
    }

    function setActiveView(view, updateHash = true) {
      if (!viewConfig[view]) return;
      activeView = view;
      const config = viewConfig[view];

      document.querySelectorAll('[role="tab"]').forEach(tab => {
        const selected = tab.dataset.view === view;
        tab.classList.toggle('active', selected);
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });

      const panel = document.getElementById('contentPanel');
      panel.setAttribute('aria-labelledby', config.tabId);
      document.getElementById('primaryLabel').textContent = config.primaryLabel;
      document.getElementById('secondaryLabel').textContent = config.secondaryLabel;

      const searchInput = document.getElementById('searchInput');
      searchInput.placeholder = config.placeholder;
      searchInput.value = searchTerms[view];

      if (updateHash && window.location.hash !== config.hash) {
        history.replaceState(null, '', config.hash);
      }
      renderActiveView();
    }

    async function loadDataset(view, filename) {
      try {
        const response = await fetch(filename);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('format JSON invalid');
        datasets[view] = data;
      } catch (error) {
        loadErrors[view] = `Datele nu au putut fi încărcate (${error.message}).`;
      }
    }

    async function init() {
      document.querySelectorAll('[role="tab"]').forEach(tab => {
        tab.addEventListener('click', () => setActiveView(tab.dataset.view));
        tab.addEventListener('keydown', event => {
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          event.preventDefault();
          const views = Object.keys(viewConfig);
          const direction = event.key === 'ArrowRight' ? 1 : -1;
          const nextIndex = (views.indexOf(activeView) + direction + views.length) % views.length;
          const nextView = views[nextIndex];
          setActiveView(nextView);
          document.getElementById(viewConfig[nextView].tabId).focus();
        });
      });

      document.getElementById('searchInput').addEventListener('input', event => {
        searchTerms[activeView] = event.target.value.trim();
        renderActiveView();
      });

      await Promise.all([
        loadDataset('meetings', 'meetings.json'),
        loadDataset('certificates', 'certificates.json'),
        loadDataset('constructionPermits', 'construction-permits.json')
      ]);

      const initialView = Object.keys(viewConfig).find(view =>
        window.location.hash === viewConfig[view].hash
      ) ?? 'meetings';
      setActiveView(initialView, false);
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
