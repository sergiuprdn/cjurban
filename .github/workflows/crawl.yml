name: Crawl

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'    # every day at 03:00 UTC

permissions:
  contents: write  # ✅ REQUIRED to allow git push

jobs:
  run-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Run the JAR
        run: |
          java -jar crawler.jar

      - name: Commit and push generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only crawler-generated static data files.
          git add meetings.json certificates.json construction-permits.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update urbanism data"
          git push origin HEAD:${{ github.ref }}
